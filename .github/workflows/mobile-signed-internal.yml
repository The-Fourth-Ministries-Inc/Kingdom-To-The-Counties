name: Mobile signed internal

# Signed Android App Bundles and iOS App Store IPAs for Play internal testing
# and TestFlight. Manual dispatch only. This workflow never submits a
# production release and never sends a build for App Store / Play review.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to sign
        type: choice
        options:
          - both
          - android
          - ios
        default: both
      upload_internal:
        description: Upload to Play internal testing (draft) and TestFlight. Never production. Requires upload secrets.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-signed-internal-${{ github.ref }}
  cancel-in-progress: false

env:
  MOBILE_API_ORIGIN: https://ambassadorcompanion.netlify.app
  ANDROID_APPLICATION_ID: com.thefourthministries.ambassadorcompanion
  IOS_BUNDLE_ID: com.thefourthministries.ambassadorcompanion

jobs:
  web:
    name: Web tests and mobile shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run application tests
        run: npm test
      - name: Prepare bundled mobile shell
        run: npm run prepare:mobile
      - name: Verify mobile runtime
        run: |
          test -f dist/index.html
          test -f dist/privacy.html
          test -f dist/support.html
          grep -F 'https://ambassadorcompanion.netlify.app' dist/mobile-runtime.js
          grep -F '/.netlify/functions/mobile-data' dist/mobile-runtime.js
          grep -F 'com.thefourthministries.ambassadorcompanion' capacitor.config.json
          grep -F 'NSCameraUsageDescription' capacitor.config.json
      - name: Upload mobile shell
        uses: actions/upload-artifact@v4
        with:
          name: ambassador-companion-web-shell
          path: dist
          retention-days: 14

  android-signed:
    name: Android signed AAB (internal only)
    needs: web
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/require-mobile-secrets.mjs android
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Create, sync, and patch Android project
        run: |
          npm run prepare:mobile
          npx cap add android
          npx cap sync android
          node scripts/patch-native.mjs android
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
      - name: Build signed Android App Bundle and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease
      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ambassador-companion-android-signed
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Require Play internal-upload secret
        if: ${{ inputs.upload_internal }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/require-mobile-secrets.mjs play
      - name: Upload AAB to Play internal testing as draft
        if: ${{ inputs.upload_internal }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.thefourthministries.ambassadorcompanion
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          changesNotSentForReview: true
          releaseName: ${{ github.run_number }}

  ios-signed:
    name: iOS signed IPA (TestFlight only)
    needs: web
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    # macos-15 still defaults to Xcode 16.4 / iOS 18.5 SDK. App Store Connect
    # rejects those IPAs. macos-26 defaults to Xcode 26.6 / iOS 26.5 SDK.
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Xcode 26 / iOS 26 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK ${SDK}"
          MAJOR="${SDK%%.*}"
          if [ "$MAJOR" -lt 26 ]; then
            echo "App Store Connect requires the iOS 26 SDK or later; got ${SDK}" >&2
            exit 1
          fi
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Require iOS signing secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: node scripts/require-mobile-secrets.mjs ios
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Create, sync, and patch iOS project
        run: |
          npm run prepare:mobile
          npx cap add ios
          npx cap sync ios
          node scripts/patch-native.mjs ios
      - name: Install Apple Distribution certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          if [ -n "$IOS_PROVISIONING_PROFILE_NAME" ]; then
            PROFILE_NAME="$IOS_PROVISIONING_PROFILE_NAME"
          else
            PROFILE_NAME="$(security cms -D -i "$PP_PATH" | plutil -extract Name raw -)"
          fi
          echo "IOS_PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Using provisioning profile: $PROFILE_NAME"
      - name: Archive signed iOS app
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          DEVELOPMENT_TEAM="$IOS_TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME"
          archive
      - name: Export App Store IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.thefourthministries.ambassadorcompanion</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload signed iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ambassador-companion-ios-signed
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14
      - name: Require TestFlight upload secrets
        if: ${{ inputs.upload_internal }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: node scripts/require-mobile-secrets.mjs testflight
      - name: Upload IPA to TestFlight
        if: ${{ inputs.upload_internal }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          umask 077
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          IPA="$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -n 1)"
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded to App Store Connect / TestFlight processing. This is not an App Store review submission."
