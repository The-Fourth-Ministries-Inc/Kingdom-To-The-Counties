name: Mobile validation

on:
  push:
    branches:
      - main
      - agent/mobile-store-readiness-clean
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  MOBILE_API_ORIGIN: https://ambassadorcompanion.netlify.app

jobs:
  web:
    name: Web tests and mobile shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run application tests
        run: npm test
      - name: Prepare bundled mobile shell
        run: npm run prepare:mobile
      - name: Verify mobile runtime
        run: |
          test -f dist/index.html
          test -f dist/privacy.html
          grep -F 'https://ambassadorcompanion.netlify.app' dist/mobile-runtime.js
          grep -F '/.netlify/functions/mobile-data' dist/mobile-runtime.js
      - name: Upload mobile shell
        uses: actions/upload-artifact@v4
        with:
          name: ambassador-companion-web-shell
          path: dist
          retention-days: 7

  android:
    name: Android unsigned debug build
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create and sync Android project
        run: |
          npm run prepare:mobile
          npx cap add android
          npx cap sync android
      - name: Build unsigned Android debug package
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Android validation package
        uses: actions/upload-artifact@v4
        with:
          name: ambassador-companion-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    name: iOS unsigned simulator build
    needs: web
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create and sync iOS project
        run: |
          npm run prepare:mobile
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS simulator app
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
